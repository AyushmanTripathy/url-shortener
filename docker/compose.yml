services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ayush
      POSTGRES_PASSWORD: a
      POSTGRES_DB: shortner
    volumes:
      - ../init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush -d shortner"]
      interval: 5s
      timeout: 5s
      retries: 5

  master:
    build:
      context: ../
      dockerfile: ./docker/master.Dockerfile
    environment:
      DB_URL: postgresql://ayush:a@db:5432/shortner
      NATS_URL: nats://nats:4222
      PORT: 80
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  edge:
    build:
      context: ../
      dockerfile: ./docker/edge.Dockerfile
    environment:
      MASTER_URL: http://master/
      NATS_URL: nats://nats:4222
      PORT: 80
    ports:
      - "8001-8002:80"
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data

volumes:
  postgres_data:
  nats_data:
