services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ayush
      POSTGRES_PASSWORD: a
      POSTGRES_DB: shortner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush -d shortner"]
      interval: 5s
      timeout: 5s
      retries: 5

  master:
    build:
      context: ../
      dockerfile: ./docker/master.Dockerfile
    environment:
      DB_URL: postgresql://ayush:a@db:5432/shortner
      PORT: 80
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  edge:
    build:
      context: ../
      dockerfile: ./docker/edge.Dockerfile
    environment:
      DB_URL: postgresql://ayush:a@db:5432/shortner
      PORT: 80
    ports:
      - "8001:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
